id: bpmn-historic-tasks
name: { ru: Завершенные задачи, en: Completed tasks }

sourceId: eproc/proc-historic-task
system: true

sortBy:
  - attribute: ended
    ascending: false

actions:
  - uiserv/action@view-task
  - uiserv/action@view-task-in-background

columns:

  - id: priority
    name:
      en: Priority
      ru: Приоритет
    formatter:
      type: workflowPriority
    editor:
      type: select
      config:
        options: [ { "label": { "ru": "Высокий", "en": "High" },"value": 1 },
                   { "label": { "ru": "Средний", "en": "Medium" },"value": 2 },
                   { "label": { "ru": "Низкий", "en": "Low" },"value": 3 } ]
    searchable: true
    sortable: true

  - id: name
    name:
      en: Task name
      ru: Название задачи
    sortable: false
    searchable: true
    formatter:
      type: action
      config:
        actionId: view-task

  - id: documentRef
    name:
      en: Document
      ru: Документ
    searchable: false
    sortable: false

  - id: documentTypeRef
    name:
      en: Document type
      ru: Тип документа
    type: ASSOC
    formatter:
      type: assoc
    editor:
      type: journal
      config:
        journalId: ecos-types
    searchable: true
    sortable: false

  - id: ended
    name:
      en: Completion date
      ru: Дата выполнения
    type: DATETIME
    searchable: true
    sortable: true

  - id: _created
    name:
      en: Start date
      ru: Дата начала
    visible: false
    type: DATETIME
    searchable: true
    sortable: true

  - id: id
    name:
      en: Name
      ru: Имя
    visible: false
    searchable: false
    sortable: false
